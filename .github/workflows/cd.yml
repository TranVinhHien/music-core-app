name: Music Core API CD

on:
  workflow_run:
    workflows: ["Music Core API CI"]
    types: [completed]
  push:
    tags: ["v*.*.*"]

concurrency:
  group: music-core-api-cd-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: music-core-api

jobs:
  publish:
    name: Build and publish immutable image
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.head_branch == 'main' ||
        github.event.workflow_run.head_branch == 'staging' ||
        github.event.workflow_run.head_branch == 'dev'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.head_sha }}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push versioned image
        uses: docker/build-push-action@v6
        with:
          context: ./music-core-api
          file: ./music-core-api/Dockerfile
          push: true
          tags: |
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha,scope=music-core-api-cd
          cache-to: type=gha,mode=max,scope=music-core-api-cd
