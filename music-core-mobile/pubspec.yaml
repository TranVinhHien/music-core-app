name: flutter_clean_architecture_example
description: "A product-shaped Flutter Clean Architecture teaching reference."

version: 0.1.0+1

environment:
  sdk: ">=3.13.4 <4.0.0"
  flutter: ">=3.47.5"

dependencies:
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  riverpod_annotation: ^4.0.7
  shared_preferences: ^2.5.5
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  freezed: ^4.0.2
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
  generate: true
