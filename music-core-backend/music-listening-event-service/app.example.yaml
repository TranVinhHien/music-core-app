app:
  name: "music-listening-event-service"
  version: "v1.0.0"

http_server:
  host: "0.0.0.0"
  port: 3004
  allow_origins:
    - "*"
  allow_methods:
    - "GET"
    - "POST"
    - "OPTIONS"
  allow_headers:
    - "Origin"
    - "Content-Type"
    - "Accept"
    - "Authorization"
    - "X-Request-ID"
    - "X-User-ID"
    - "X-User-Email"
    - "X-User-Roles"
  mode: "debug"
  log_level: "debug"

logger:
  level: "debug"
  pretty: true

mongodb:
  uri: "mongodb://localhost:27017"
  database: "music_core_events"
  collection: "listening_events"
  max_pool_size: 100
  min_pool_size: 10
  connect_timeout_seconds: 10

token:
  secret: "change-me-to-a-long-random-secret"

batch:
  max_batch_size: 100
