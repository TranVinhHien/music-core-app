app:
  name: "sp-product-core-svc"
  version: "dev"

http_server:
  host: "0.0.0.0"
  port: 8080
  grpc_port: 8080
  allow_origins: ["*"]
  allow_methods: ["GET", "POST", "PUT", "PATCH", "DELETE", "OPTIONS"]
  allow_headers: ["*"]
  mode: "debug"
  log_level: "debug"

token:
  secret: "change-me-to-a-long-random-secret"
  access_token_expiration_time: 3600
  refresh_token_expiration_time: 86400

cockroach_db:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  db_name: "music-core-db"
  ssl_mode: "disable"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: "10m"
  log_level: "info"

aws:
  region: "ap-northeast-2"
  access_key_id: "YOUR_AWS_ACCESS_KEY_ID"
  secret_access_key: "YOUR_AWS_SECRET_ACCESS_KEY"
  bucket_name: "travel-app-dev-123125345634"
